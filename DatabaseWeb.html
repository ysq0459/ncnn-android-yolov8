<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Viewer</title>
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <style>
        /* 自定义样式 */
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        h1 {
            color: #343a40;
            text-align: center;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        table {
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }

        th {
            background-color: #007bff;
            color: white;
        }

        td img {
            max-width: 150px;
            max-height: 150px;
            border-radius: 5px;
            transition: transform 0.3s ease;
        }

        td img:hover {
            transform: scale(1.1);
        }

        .btn-danger {
            transition: background-color 0.3s ease;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }
    </style>
</head>

<body>
    <h1>Database Records</h1>
    <div class="container">
        <table id="recordsTable" class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Label</th>
                    <th>Image</th>
                    <th>Detection Result</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        async function fetchData() {
            try {
                const response = await fetch('http://<DEVICE_IP>:8080/records');
                const data = await response.json();

                const tableBody = document.querySelector('#recordsTable tbody');
                tableBody.innerHTML = '';

                data.forEach(record => {
                    const row = document.createElement('tr');

                    // 显示 ID
                    const idCell = document.createElement('td');
                    idCell.textContent = record.id;
                    row.appendChild(idCell);

                    // 显示标签
                    const labelCell = document.createElement('td');
                    labelCell.textContent = record.label;
                    row.appendChild(labelCell);

                    // 显示图片
                    const imgCell = document.createElement('td');
                    if (record.image_path) {
                        const img = document.createElement('img');
                        img.src = 'file://' + record.image_path;
                        img.alt = 'Image';
                        imgCell.appendChild(img);
                    }
                    row.appendChild(imgCell);

                    // 显示检测结果
                    const resultCell = document.createElement('td');
                    resultCell.textContent = record.detection_result;
                    row.appendChild(resultCell);

                    // 删除按钮
                    const actionCell = document.createElement('td');
                    const deleteBtn = document.createElement('button');
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.classList.add('btn', 'btn-danger');
                    deleteBtn.onclick = () => deleteRecord(record.id);
                    actionCell.appendChild(deleteBtn);
                    row.appendChild(actionCell);

                    tableBody.appendChild(row);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        async function deleteRecord(id) {
            if (confirm('Delete record ' + id + '?')) {
                try {
                    const response = await fetch('http://<DEVICE_IP>:8080/delete', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: `id=${id}`
                    });

                    if (response.ok) {
                        fetchData(); // 刷新数据
                    } else {
                        alert('Delete failed');
                    }
                } catch (error) {
                    console.error('Delete error:', error);
                }
            }
        }

        // 页面加载时获取数据
        window.onload = fetchData;
    </script>
    <!-- 引入 Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
</body>

</html>
